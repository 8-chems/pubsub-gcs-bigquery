name: CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - "dashboards/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch: # run it by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy halfway

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west9' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  infra:
    name: Terraform apply
    needs: ci
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment (repo Settings > Environments)
    # to get a manual approval gate before anything changes in GCP.
    environment: production
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west9' }}
      TF_VAR_enable_pull_subscription: "false"
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
      - name: Use the shared remote state
        run: |
          cat > backend.tf <<TF
          terraform {
            backend "gcs" {
              bucket = "${{ vars.TF_STATE_BUCKET }}"
              prefix = "pubsub-pipeline"
            }
          }
          TF
      - run: terraform init
      - run: terraform apply -auto-approve -input=false

  app:
    name: Build image and deploy Cloud Run
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/apps/ingest-push:${GITHUB_SHA}"
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy the service and push subscription
        run: ./scripts/deploy_push.sh

  smoke:
    name: Smoke test in GCP
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload a file and wait for the row in BigQuery
        run: ./scripts/smoke_test.sh
